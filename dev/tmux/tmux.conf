# cc-sidebar's tmux (installed to ~/.config/cc-sidebar/tmux.conf). Sessions run on a private
# socket (`tmux -L cc-sidebar`), so this never touches your own tmux setup. tmux only keeps
# Claude Code running while no terminal shows it; it should otherwise be invisible.

# No prefix key: Claude Code uses Ctrl+B itself (send a command to the background), and there
# is nothing to drive in tmux by hand.
set -g prefix None
unbind C-b
set -g status off
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
# Mouse wheel scrolls tmux's history; Shift+drag selects in the terminal itself.
set -g mouse on
# Copying in tmux reaches the system clipboard (OSC 52).
set -g set-clipboard on
# Shift+Enter and other modified keys reach Claude Code.
set -g extended-keys on
set -as terminal-features ',xterm*:extkeys'
# Colours, hyperlinks and notifications pass through.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB:hyperlinks'
set -g allow-passthrough on
# The outer tab title follows Claude's ("[cc:<tag>] project"), so the sidebar can find it.
set -g set-titles on
set -g set-titles-string '#{pane_title}'
# Several viewers of one session: size it to whichever was used last.
set -g window-size latest
